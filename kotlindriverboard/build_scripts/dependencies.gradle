ext {
    androidMinSdkVersion = 24
    androidTargetSdkVersion = 34
    androidCompileSdkVersion = 34
    androidBuildToolsVersion = "34.0.0"

    lifecycleVersion = '2.7.0'
    nav_version = "2.7.7"
    chuckerVersion = "3.5.2"
    koinVersion = '3.5.3'
    retrofitVersion = '2.9.0'
    okHttpVersion = '4.5.0'
    coroutines_version = '1.8.0'
    compose_version = "1.6.1"
    compose_material3_version = "1.2.0"
    coil_version = "2.5.0"
    accompanist_version = "0.32.0"
    maps_compose_version = "4.3.3"

    androidXDependencies = [
            appcompat       : "androidx.appcompat:appcompat:1.5.0",
            materialDesign  : "com.google.android.material:material:1.7.0",
            constraintLayout: "androidx.constraintlayout:constraintlayout:2.1.4",
            coreKtx         : 'androidx.core:core-ktx:1.12.0',
            fragmentKtx     : 'androidx.fragment:fragment-ktx:1.3.0-alpha04',
            lifecycleExt    : "androidx.lifecycle:lifecycle-extensions:2.0.0",
            nav_fragment    : "androidx.navigation:navigation-fragment-ktx:$nav_version",
            nav_ui          : "androidx.navigation:navigation-ui-ktx:$nav_version",
            viewPager2      : "androidx.viewpager2:viewpager2:1.0.0",
            webkit          : "androidx.webkit:webkit:1.9.0",
            securityCrypto  : "androidx.security:security-crypto:1.1.0-alpha06",
    ]

    koinDependencies = [
            core   : "io.insert-koin:koin-core:$koinVersion",
            android: "io.insert-koin:koin-android:$koinVersion",
    ]

    networkDependencies = [
            core             : "com.squareup.retrofit2:retrofit:$retrofitVersion",
            gsonConverter    : "com.squareup.retrofit2:converter-gson:$retrofitVersion",
            gson             : 'com.google.code.gson:gson:2.10.1',
            okHttp           : "com.squareup.okhttp3:okhttp:$okHttpVersion",
            okHttpInterceptor: "com.squareup.okhttp3:logging-interceptor:$okHttpVersion"
    ]

    jetpack = [
            legacySupport        : "androidx.legacy:legacy-support-v4:1.0.0",
            lifecycleLiveDataKtx : "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycleVersion",
            lifecycleViewModelKtx: "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion",
            lifecycleRuntime     : "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion",
            compose: [
                    ui                   : "androidx.compose.ui:ui:$compose_version",
                    ui_graphics          : "androidx.compose.ui:ui-graphics:$compose_version",
                    ui_tooling           : "androidx.compose.ui:ui-tooling:$compose_version",
                    ui_tooling_preview   : "androidx.compose.ui:ui-tooling-preview:$compose_version",
                    material             : "androidx.compose.material:material:$compose_version",
                    viewBinding          : "androidx.compose.ui:ui-viewbinding:$compose_version",
                    runtime              : "androidx.compose.runtime:runtime:$compose_version",
                    animation            : "androidx.compose.animation:animation:$compose_version",
                    activity             : "androidx.activity:activity-compose:1.8.2",
                    themeAdapter         : "com.google.android.material:compose-theme-adapter:1.1.19",
                    materialIconsExtended: "androidx.compose.material:material-icons-extended:$compose_version",
                    constraintlayout     : "androidx.constraintlayout:constraintlayout-compose:1.0.0",
                    coil                 : "io.coil-kt:coil-compose:$coil_version",
                    lifecycle            : "androidx.lifecycle:lifecycle-runtime-compose:2.6.0-alpha03",
                    lifecycleViewModel   : "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion",
                    paging               : "androidx.paging:paging-compose:1.0.0-alpha17",
            ],
            accompanist: [
                    pager             : "com.google.accompanist:accompanist-pager:$accompanist_version",
                    pagerIndicators   : "com.google.accompanist:accompanist-pager-indicators:$accompanist_version",
                    swiperefresh      : "com.google.accompanist:accompanist-swiperefresh:$accompanist_version",
                    systemuicontroller: "com.google.accompanist:accompanist-systemuicontroller:$accompanist_version",
                    flowLayout        : "com.google.accompanist:accompanist-flowlayout:$accompanist_version",
                    webview           : "com.google.accompanist:accompanist-webview:$accompanist_version",
            ],
    ]

    kotlin = [
            coroutinesAndroid: "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version",
            serialization    : "org.jetbrains.kotlinx:kotlinx-serialization-json:1.2.2"
    ]


    libs = [
            coil: "io.coil-kt:coil:$coil_version",
            maps: [
                    googleMapsCompose: "com.google.maps.android:maps-compose:$maps_compose_version",
                    googleMapsComposeWidgets: "com.google.maps.android:maps-compose-widgets:$maps_compose_version",
            ],
    ]

    chuckerDependencies = [
            chucker    : "com.github.chuckerteam.chucker:library:$chuckerVersion",
            chuckerNoOp: "com.github.chuckerteam.chucker:library-no-op:$chuckerVersion"
    ]
}